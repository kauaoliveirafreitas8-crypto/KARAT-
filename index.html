    <!-- Repassador Global de UTMs e Disparo de IC Kiwify -->
    <script>
      (function() {
        function attachTrackingToLinks() {
          try {
            var params = new URLSearchParams(window.location.search);
            var links = document.querySelectorAll('a[href*="pay.kiwify.com.br"]');
            links.forEach(function(link) {
              var href = link.getAttribute('href');
              if (!href) return;
              try {
                var url = new URL(href, window.location.href);
                // Define parâmetros padrão caso não existam
                if (!url.searchParams.has('src')) {
                  var isComplete = href.indexOf('i32sxoH') !== -1;
                  url.searchParams.set('src', isComplete ? 'plano_completo' : 'plano_basico');
                }
                if (!url.searchParams.has('sck')) {
                  var isComplete = href.indexOf('i32sxoH') !== -1;
                  url.searchParams.set('sck', isComplete ? 'plano_completo' : 'plano_basico');
                }
                // Anexa parâmetros da URL da página
                params.forEach(function(val, key) {
                  if (!url.searchParams.has(key)) {
                    url.searchParams.set(key, val);
                  }
                });
                var newHref = url.toString();
                if (link.getAttribute('href') !== newHref) {
                  link.setAttribute('href', newHref);
                  link.setAttribute('data-href', newHref);
                  link.setAttribute('data-url', newHref);
                  link.setAttribute('data-checkout-url', newHref);
                }
              } catch(e) {}
            });
          } catch(e) {}
        }

        // Executa ao carregar e escuta interações de hover/toque
        document.addEventListener('DOMContentLoaded', attachTrackingToLinks);
        window.addEventListener('load', attachTrackingToLinks);
        document.addEventListener('mouseover', function(e) {
          var target = e.target && e.target.closest ? e.target.closest('a[href*="pay.kiwify.com.br"]') : null;
          if (target) attachTrackingToLinks();
        }, true);
        document.addEventListener('touchstart', function(e) {
          var target = e.target && e.target.closest ? e.target.closest('a[href*="pay.kiwify.com.br"]') : null;
          if (target) attachTrackingToLinks();
        }, { passive: true, capture: true });
      })();
